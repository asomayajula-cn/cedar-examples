apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-gateway
  namespace: cedar-examples
  labels:
    app: payment-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-gateway
  template:
    metadata:
      labels:
        app: payment-gateway
    spec:
      containers:
        - name: payment-gateway
          image: ghcr.io/asomayajula-cn/payment-gateway:main
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: PORT
              value: "8081"
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
